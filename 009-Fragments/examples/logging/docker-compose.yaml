# ──────────────────────────────────────────────────────────────
# Docker Compose Logging Driver Fragments
# ──────────────────────────────────────────────────────────────
# Docker supports multiple logging drivers. Using YAML anchors
# you can define reusable logging configurations.
# ──────────────────────────────────────────────────────────────

# ── Reusable Logging Fragments ────────────────────────────────
x-logging-json: &logging-json
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-logging-local: &logging-local
  logging:
    driver: "local"
    options:
      max-size: "10m"
      max-file: "3"

x-logging-syslog: &logging-syslog
  logging:
    driver: "syslog"
    options:
      syslog-address: "tcp://logs.example.com:514"
      tag: "{{.Name}}/{{.ID}}"

x-logging-gelf: &logging-gelf
  logging:
    driver: "gelf"
    options:
      gelf-address: "udp://graylog.example.com:12201"
      tag: "{{.Name}}"

x-logging-fluentd: &logging-fluentd
  logging:
    driver: "fluentd"
    options:
      fluentd-address: "localhost:24224"
      tag: "{{.Name}}"

x-logging-none: &logging-none
  logging:
    driver: "none"

x-logging-aws: &logging-aws
  logging:
    driver: "awslogs"
    options:
      awslogs-group: "my-docker-logs"
      awslogs-region: "us-east-1"
      awslogs-stream: "{{.Name}}"

x-logging-gcplogs: &logging-gcplogs
  logging:
    driver: "gcplogs"
    options:
      gcp-log-cmd: "true"

# ── Services ──────────────────────────────────────────────────
services:

  app-json:
    image: nginx:alpine
    ports:
      - "8081:80"
    <<: *logging-json

  app-local:
    image: nginx:alpine
    ports:
      - "8082:80"
    <<: *logging-local

  app-syslog:
    image: nginx:alpine
    ports:
      - "8083:80"
    <<: *logging-syslog

  app-gelf:
    image: nginx:alpine
    ports:
      - "8084:80"
    <<: *logging-gelf

  app-fluentd:
    image: nginx:alpine
    ports:
      - "8085:80"
    <<: *logging-fluentd

  app-none:
    image: nginx:alpine
    ports:
      - "8086:80"
    <<: *logging-none
