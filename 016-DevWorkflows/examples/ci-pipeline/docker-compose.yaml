services:
  lint:
    image: alpine:latest
    command: >
      sh -c "
        echo 'Running linter...' &&
        sleep 2 &&
        echo '✓ No lint errors found'
      "

  test-unit:
    image: alpine:latest
    command: >
      sh -c "
        echo 'Running unit tests...' &&
        sleep 3 &&
        echo '✓ 42 tests passed, 0 failed'
      "
    depends_on:
      lint:
        condition: service_completed_successfully

  test-integration:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        until curl -sf http://app:80; do sleep 1; done &&
        echo 'Running integration tests...' &&
        sleep 3 &&
        echo '✓ 15 tests passed, 0 failed'
      "
    depends_on:
      test-unit:
        condition: service_completed_successfully
      app:
        condition: service_started

  build:
    image: alpine:latest
    command: >
      sh -c "
        echo 'Building production image...' &&
        sleep 4 &&
        echo '✓ Image built: myapp:latest'
      "
    depends_on:
      test-integration:
        condition: service_completed_successfully

  app:
    image: nginx:alpine
    ports:
      - "8210:80"
