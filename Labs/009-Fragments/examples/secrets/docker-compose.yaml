# ──────────────────────────────────────────────────────────────
# Docker Compose Secrets Fragments
# ──────────────────────────────────────────────────────────────
# Manage sensitive data using Docker secrets with reusable
# configurations.
# ──────────────────────────────────────────────────────────────

# ── Reusable Secret Fragments ─────────────────────────────────
x-secrets-file: &secrets-file
  secrets:
    - db_password
    - api_key
    - tls_cert

x-secrets-external: &secrets-external
  secrets:
    - db_password
    - api_key

x-secrets-db: &secrets-db
  secrets:
    - db_password
    - db_root_password

x-secrets-tls: &secrets-tls
  secrets:
    - tls_cert
    - tls_key

# ── Secret Definitions ────────────────────────────────────────
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  api_key:
    file: ./secrets/api_key.txt
  tls_cert:
    file: ./secrets/tls_cert.pem
  tls_key:
    file: ./secrets/tls_key.pem

# ── Services ──────────────────────────────────────────────────
services:

  web:
    image: nginx:alpine
    ports:
      - "8131:80"
    <<: *secrets-file
    secrets:
      - db_password
      - api_key
      - tls_cert
      - tls_key

  app:
    image: node:20-alpine
    command: ["sleep", "infinity"]
    <<: *secrets-db
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
