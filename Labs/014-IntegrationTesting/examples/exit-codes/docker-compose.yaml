services:
  app:
    image: nginx:alpine
    ports:
      - "8204:80"

  test-pass:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        until curl -sf http://app:80; do sleep 1; done &&
        echo 'All assertions passed' &&
        exit 0
      "
    depends_on:
      - app

  test-fail:
    image: alpine:latest
    command: >
      sh -c "
        echo 'This test intentionally fails' &&
        exit 1
      "

  test-skip:
    image: alpine:latest
    command: >
      sh -c "
        echo 'Skipped due to missing dependency' &&
        exit 0
      "
