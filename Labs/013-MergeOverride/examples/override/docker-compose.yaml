services:
  web:
    image: nginx:alpine
    ports:
      - "8198:80"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=warn
    volumes:
      - ./app:/usr/share/nginx/html:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
