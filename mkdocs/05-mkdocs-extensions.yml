###
### mkdocs-extensions.yml
###

markdown_extensions:
    - toc:
          permalink: true
          baselevel: 1
          toc_depth: 3
    - abbr
    - tables
    - admonition
    - footnotes
    - attr_list
    - def_list
    - md_in_html
    - smarty
    - meta
    - codehilite:
          guess_lang: true
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.details
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.betterem:
          smart_enable: all
    - pymdownx.tilde
    - pymdownx.snippets
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
